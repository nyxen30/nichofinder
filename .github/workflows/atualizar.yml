name: Atualizar Niche Finder

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
    inputs:
      so_reclassificar:
        description: 'Só reclassificar os canais já salvos (não busca nada, não gasta cota)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: niche-finder
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reclassificar canais salvos (sem cota)
        if: ${{ inputs.so_reclassificar }}
        run: node scripts/retag.mjs
      - name: Buscar canais novos
        if: ${{ !inputs.so_reclassificar }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
        run: node scripts/update.mjs
      - name: Salvar resultado
        run: |
          git config user.name "niche-finder-bot"
          git config user.email "niche-finder-bot@users.noreply.github.com"
          git add site/data/channels.json data/state.json
          git diff --cached --quiet || git commit -m "Atualiza canais $(date -u +%Y-%m-%d)"
          git push
